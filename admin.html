<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Godfather EA — Admin</title>
<style>
:root{
  --bg:#0e1a33; --card:#12224a; --line:#24407a; --text:#fff; --muted:#93a6cc; --blue:#2f6fed; --green:#1ea672;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.screen{display:none;min-height:100%;box-sizing:border-box;padding:20px;flex-direction:column}
.screen.on{display:flex}
h1{font-size:1.3rem;margin:8px 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 22px}
label{display:block;font-size:.85rem;color:var(--muted);margin:16px 0 6px}
input,select{width:100%;box-sizing:border-box;height:52px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:#fff;padding:0 16px;font-size:1rem}
select{appearance:none}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.plan{border:1px solid var(--line);border-radius:12px;background:var(--card);color:#fff;padding:14px;text-align:center;font:inherit}
.plan b{display:block;font-size:1rem}
.plan small{color:var(--muted)}
.plan.on{border-color:var(--blue);background:#17306b}
.plan.full{grid-column:1/-1;position:relative}
.badge{position:absolute;top:8px;right:8px;background:#e0a327;color:#1a1200;font-size:.65rem;font-weight:700;
  padding:3px 8px;border-radius:8px}
.chk{display:flex;align-items:flex-start;gap:10px;margin:22px 0;font-size:.9rem;color:var(--muted)}
.chk input{width:20px;height:20px;flex:none;margin-top:2px}
.btn{margin-top:auto;width:100%;height:54px;border:0;border-radius:14px;background:var(--blue);color:#fff;
  font-size:1.05rem;font-weight:600}
.btn:disabled{opacity:.5}
.btn.green{background:var(--green)}
.btn.ghost{background:transparent;border:1px solid var(--line);margin-top:10px}
.err{min-height:1.2em;color:#ff8a80;font-size:.85rem;margin:6px 0 0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.top button{background:none;border:0;color:#fff;padding:6px}
.keybox{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;font-size:1.15rem;
  letter-spacing:.04em;margin:18px 0;word-break:break-all}
.pill{display:inline-block;font-size:.8rem;color:var(--green);margin-top:10px}
.gate{align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body>

<!-- Admin token gate: kept in this browser only, sent as a header on every request -->
<main id="gate" class="screen on gate">
  <h1>Godfather EA admin</h1>
  <p class="sub">Enter the admin token to continue.</p>
  <input id="token" type="password" placeholder="Admin token" style="max-width:340px">
  <p class="err" id="gateErr"></p>
  <button class="btn" id="gateGo" style="max-width:340px;margin-top:14px">Continue</button>
</main>

<!-- Step 1: generate a key -->
<main id="gen" class="screen">
  <h1>Generate Licence Key</h1>
  <p class="sub">Authorise a user by selecting their EA and subscription plan.</p>

  <label>Client name</label>
  <input id="clientName" placeholder="Enter the account holder's name">

  <label>Expert Advisor</label>
  <select id="botSelect"><option value="">Loading…</option></select>

  <label>Subscription plan</label>
  <div class="plans" id="plans">
    <button class="plan" data-days="3"><b>3</b><small>days</small></button>
    <button class="plan" data-days="5"><b>5</b><small>days</small></button>
    <button class="plan" data-days="30"><b>30</b><small>days</small></button>
    <button class="plan" data-days="90"><b>3</b><small>months</small></button>
    <button class="plan" data-days="180"><b>6</b><small>months</small></button>
    <button class="plan" data-days="365"><b>1</b><small>year</small></button>
    <button class="plan full" data-days=""><span class="badge">BEST VALUE</span><b>Lifetime</b><small>unlimited access</small></button>
  </div>

  <label class="chk"><input type="checkbox" id="confirm">
    I confirm that the details above are correct and I want to generate a licence key for this user.</label>

  <p class="err" id="genErr"></p>
  <button class="btn" id="genGo" disabled>Generate Licence Key</button>
</main>

<!-- Step 2: share the key -->
<main id="share" class="screen">
  <div class="top"><button id="shareBack" aria-label="Back">←</button><h1 style="margin:0">Licence key ready</h1></div>
  <p class="sub" id="shareFor"></p>
  <div class="keybox" id="keyText"></div>
  <button class="btn ghost" id="copyBtn">Copy to clipboard</button>
  <p class="pill" id="copiedPill" style="visibility:hidden">Copied to clipboard</p>

  <label>Send to client's email</label>
  <input id="clientEmail" type="email" placeholder="client@email.com">
  <button class="btn green" id="mailBtn" style="margin-top:16px">Send Email</button>
  <p class="pill" id="mailPill" style="visibility:hidden">Email drafted — finish sending it in your mail app</p>

  <button class="btn ghost" id="newKey">Generate another key</button>
</main>

<script>
const $ = s => document.querySelector(s);
const API = "https://godfather-ea-server.onrender.com"; // your Render server
function show(id){ document.querySelectorAll('.screen').forEach(e => e.classList.toggle('on', e.id === id)); }

let token = localStorage.getItem('godfatherAdminToken') || '';
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-admin-token': token, ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadBots() {
  const sel = $('#botSelect');
  try {
    const { bots } = await api('/admin/bots');
    sel.innerHTML = '<option value="">Choose an Expert Advisor</option>' +
      bots.map(b => `<option value="${b.id}">${b.name} (${b.platform.toUpperCase()})</option>`).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">Could not load bots</option>';
    $('#gateErr').textContent = e.message;
  }
}

$('#gateGo').onclick = async () => {
  token = $('#token').value.trim();
  if (!token) { $('#gateErr').textContent = 'Enter the admin token.'; return; }
  try {
    await api('/admin/bots'); // proves the token works
    localStorage.setItem('godfatherAdminToken', token);
    $('#gateErr').textContent = '';
    show('gen'); loadBots();
  } catch (e) {
    $('#gateErr').textContent = e.message === 'Forbidden' ? 'Incorrect token.' : ('Could not reach the server: ' + e.message);
  }
};
if (token) { show('gen'); loadBots(); } // skip the gate if already unlocked on this device

let plan; // undefined = not yet chosen; null = Lifetime (no expiry); number = days
document.querySelectorAll('.plan').forEach(b => b.onclick = () => {
  plan = b.dataset.days === '' ? null : Number(b.dataset.days);
  document.querySelectorAll('.plan').forEach(x => x.classList.toggle('on', x === b));
});
function checkGenReady() {
  $('#genGo').disabled = !($('#botSelect').value && plan !== undefined && $('#confirm').checked);
}
$('#confirm').onchange = checkGenReady;
$('#botSelect').onchange = checkGenReady;
document.querySelectorAll('.plan').forEach(b => b.addEventListener('click', () => { plan = plan; checkGenReady(); }));

let lastKey = '';
$('#genGo').onclick = async () => {
  $('#genErr').textContent = '';
  try {
    const { keys } = await api('/admin/keys', {
      method: 'POST',
      body: JSON.stringify({
        botId: Number($('#botSelect').value),
        count: 1,
        expiresInDays: plan,
        issuedTo: $('#clientName').value.trim() || null,
      }),
    });
    lastKey = keys[0];
    $('#keyText').textContent = lastKey;
    $('#shareFor').textContent = $('#clientName').value.trim()
      ? 'For ' + $('#clientName').value.trim() + ' — ' + $('#botSelect').selectedOptions[0].text
      : $('#botSelect').selectedOptions[0].text;
    $('#copiedPill').style.visibility = 'hidden';
    $('#mailPill').style.visibility = 'hidden';
    $('#clientEmail').value = '';
    show('share');
  } catch (e) { $('#genErr').textContent = e.message; }
};

$('#shareBack').onclick = () => show('gen');
$('#newKey').onclick = () => {
  $('#clientName').value = ''; $('#confirm').checked = false; plan = undefined;
  document.querySelectorAll('.plan').forEach(x => x.classList.remove('on'));
  checkGenReady(); show('gen');
};

$('#copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(lastKey); $('#copiedPill').style.visibility = 'visible'; }
  catch (e) { alert('Key: ' + lastKey); }
};

$('#mailBtn').onclick = () => {
  const email = $('#clientEmail').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { alert('Enter a valid email first.'); return; }
  const subject = encodeURIComponent('Your Godfather EA licence key');
  const body = encodeURIComponent(
    'Hi,\n\nHere is your licence key for ' + ($('#botSelect').selectedOptions[0]?.text || 'your EA') + ':\n\n' +
    lastKey + '\n\nEnter this in the app under "Add a new EA" to activate it.\n'
  );
  window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
  $('#mailPill').style.visibility = 'visible';
};
</script>
</body>
</html>
